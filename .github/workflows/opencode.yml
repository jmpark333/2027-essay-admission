                "",
                "---",
                "*This PR was auto-generated by Claude Code bot*",
              ].join("\n"),
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: "🤖 Claude Code created PR #" + pr.data.number + " on branch `" + branch + "`\n\n" + (plan.explanation || ""),
            });
        env:
          PLAN_B64: ${{ steps.api-cc.outputs.plan_b64 }}
          BRANCH: ${{ steps.branch-cc.outputs.branch }}
