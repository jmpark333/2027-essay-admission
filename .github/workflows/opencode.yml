name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  oc:
    name: "OpenCode (/oc)"
    if: |
      github.event_name == 'issue_comment' &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    steps:
      - name: React to comment (/oc)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: "eyes",
            });

      - name: Call Nous API (/oc)
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = context.payload.comment.body;
            const isIssue = !!context.payload.issue;
            const number = isIssue
              ? context.payload.issue.number
              : context.payload.pull_request?.number;

            const prompt = `You are a helpful coding assistant on GitHub.
            A user wrote this comment on a GitHub ${isIssue ? 'issue' : 'pull request'}:

            "${commentBody}"

            Provide a concise, helpful response. Use markdown.`;

            const res = await fetch(
              "https://inference-api.nousresearch.com/v1/chat/completions",
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${process.env.NOUS_API_KEY}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  model: "meituan/longcat-2.0:free",
                  messages: [{ role: "user", content: prompt }],
                  max_tokens: 2048,
                }),
              }
            );

            if (!res.ok) {
              const err = await res.text();
              core.setFailed(`Nous API error ${res.status}: ${err}`);
              return;
            }

            const data = await res.json();
            const reply = data.choices?.[0]?.message?.content ?? "(no response)";

            const marker = "<!-- oc-bot -->";
            const body = `${marker}\n🤖 **OpenCode** responded:\n\n${reply}`;

            if (isIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
            } else {
              await github.rest.pulls.createReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
                body,
                commit_id: context.payload.comment.commit_id,
                path: context.payload.comment.path,
                line: context.payload.comment.line ?? context.payload.comment.original_line,
              });
            }
        env:
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}

  cc:
    name: "Claude Code (/cc)"
    if: |
      github.event_name == 'issue_comment' &&
      (
        contains(github.event.comment.body, ' /cc') ||
        startsWith(github.event.comment.body, '/cc')
      )
    runs-on: ubuntu-latest
    steps:
      - name: React to comment (/cc)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: "eyes",
            });

      - name: Call Nous API (/cc)
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = context.payload.comment.body;
            const isIssue = !!context.payload.issue;
            const number = isIssue
              ? context.payload.issue.number
              : context.payload.pull_request?.number;

            const prompt = `You are Claude Code, a helpful coding assistant on GitHub.
            A user wrote this comment on a GitHub ${isIssue ? 'issue' : 'pull request'}:

            "${commentBody}"

            Provide a concise, helpful response. Use markdown.`;

            const res = await fetch(
              "https://inference-api.nousresearch.com/v1/chat/completions",
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${process.env.NOUS_API_KEY}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  model: "meituan/longcat-2.0:free",
                  messages: [{ role: "user", content: prompt }],
                  max_tokens: 2048,
                }),
              }
            );

            if (!res.ok) {
              const err = await res.text();
              core.setFailed(`Nous API error ${res.status}: ${err}`);
              return;
            }

            const data = await res.json();
            const reply = data.choices?.[0]?.message?.content ?? "(no response)";

            const marker = "<!-- cc-bot -->";
            const body = `${marker}\n🤖 **Claude Code** responded:\n\n${reply}`;

            if (isIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
            } else {
              await github.rest.pulls.createReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
                body,
                commit_id: context.payload.comment.commit_id,
                path: context.payload.comment.path,
                line: context.payload.comment.line ?? context.payload.comment.original_line,
              });
            }
        env:
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
