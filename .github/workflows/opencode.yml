name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Node 20 deprecation 경고 해결 (github-script@v7이 Node 20 사용)
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  oc:
    name: "OpenCode (/oc)"
    if: |
      github.event_name == 'issue_comment' &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: React to comment (/oc)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: "eyes",
            });

      - name: Call Nous API (/oc)
        id: api-oc
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = context.payload.comment.body;
            const isIssue = !!context.payload.issue;
            const number = isIssue
              ? context.payload.issue.number
              : context.payload.pull_request?.number;

            const filesResp = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: ".",
            });
            const fileList = filesResp.data
              .map(f => (f.type === "dir" ? "[dir] " : "") + f.name)
              .join("\n");

            let indexHtml = "";
            try {
              const idx = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "index.html",
              });
              indexHtml = Buffer.from(idx.data.content, "base64").toString("utf8");
            } catch (e) {
              indexHtml = "(index.html not found)";
            }

            // CSS를 제외하고 실제 데이터(HTML body + JS)만 추출해 프롬프트 크기 절감
            // CSS(<style>~</style>)는 편집 대상이 아니므로 잘라냄
            const bodyStart = indexHtml.indexOf("<body>");
            let contentForPrompt = bodyStart >= 0 ? indexHtml.substring(bodyStart) : indexHtml;
            contentForPrompt = contentForPrompt.replace(/<style>[\s\S]*?<\/style>/g, "[CSS 생략]");

            const systemPrompt = [
              "You are a code-editing bot for the GitHub repository \"" + context.repo.owner + "/" + context.repo.repo + "\".",
              "",
              "WHAT THIS REPO IS:",
              "Static HTML site for 2027 Korean university essay admission calendar (2027학년도 논술전형 달력).",
              "",
              "INDEX.HTML DATA STRUCTURE (inline JS):",
              "- events.deadlines[]: { name, start(YYYY-MM-DD), end, color }",
              "- events.exams[]: { name, date(YYYY-MM-DD), type, end? }",
              "- events.results[]: { name, date(YYYY-MM-DD) }",
              "- events.monthly[]: month-by-month schedule rendered in calendar view",
              "",
              "IMPORTANT: Use EXACT values from the file content below.",
              "University names use SHORT form with single quotes, e.g. '한양대' NOT '한양대학교', '연세대' NOT '연세대학교'.",
              "Dates use format: YYYY-MM-DD (with hyphens).",
              "",
              "AVAILABLE FILES:",
              fileList,
              "",
              "CURRENT INDEX.HTML CONTENT:",
              contentForPrompt.substring(0, 8000),
              contentForPrompt.length > 8000 ? "\n...[truncated, total " + contentForPrompt.length + " chars]" : "",
              "",
              "YOUR TASK:",
              "The user wants to fix or modify data/code in this repo.",
              "You MUST respond with ONLY a valid JSON object — no markdown, no explanation.",
              "",
              "RESPONSE FORMAT (strict JSON):",
              "{",
              "  \"explanation\": \"1-2 sentence summary of what you changed\",",
              "  \"branch\": \"short-kebab-case-branch-name\",",
              "  \"edits\": [",
              "    {",
              "      \"file\": \"index.html\",",
              "      \"old\": \"exact string to find (must match exactly including whitespace)\",",
              "      \"new\": \"replacement string\"",
              "    }",
              "  ]",
              "}",
              "",
              "RULES:",
              "- \"old\" must match the EXACT text shown in CURRENT INDEX.HTML CONTENT above (copy-paste from it, do NOT guess or reconstruct)",
              "- NEVER invent or guess the \"old\" text. If the target text is not in CURRENT INDEX.HTML CONTENT, do NOT make up an edit — report in explanation that the content is truncated",
              "- If multiple changes, include multiple objects in \"edits\" array",
              "- Keep \"old\" as short as possible but unique within the file",
              "- branch name: short, descriptive, kebab-case (e.g. \"fix-hanyang-date\")",
              "- ONLY return the JSON object, no other text",
            ].join("\n");

            const userPrompt = "User request:\n\n\"" + commentBody + "\"\n\nReturn the JSON edit plan.";

            // --- Nous API 호출 (3회 재시도) ---
            // 무료 모델은 524 타임아웃/일시적 오류가 잦으므로 재시도 루프 적용
            let parsed = null;
            let lastError = "";

            for (let attempt = 1; attempt <= 3; attempt++) {
              console.log("--- Nous API attempt " + attempt + "/3 ---");

              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 290000);

              let res;
              try {
                res = await fetch(
                  "https://inference-api.nousresearch.com/v1/chat/completions",
                  {
                    method: "POST",
                    headers: {
                      Authorization: "Bearer " + process.env.NOUS_API_KEY,
                      "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                      model: "poolside/laguna-s-2.1:free",
                      messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: userPrompt },
                      ],
                      max_tokens: 16384,
                      temperature: 0.3,
                    }),
                    signal: controller.signal,
                  }
                );
              } catch (e) {
                clearTimeout(timeout);
                lastError = "network/timeout: " + e.message;
                console.error("Attempt " + attempt + " failed: " + lastError);
                await new Promise(r => setTimeout(r, 5000 * attempt));
                continue;
              }
              clearTimeout(timeout);

              console.log("Nous API status: " + res.status);

              if (!res.ok) {
                const err = await res.text();
                lastError = "HTTP " + res.status + ": " + err.substring(0, 300);
                console.error("Attempt " + attempt + " failed: " + lastError);
                await new Promise(r => setTimeout(r, 5000 * attempt));
                continue;
              }

              const data = await res.json();

              // Log full API response for debugging
              console.log("=== FULL API RESPONSE ===");
              console.log(JSON.stringify(data, null, 2).substring(0, 3000));
              console.log("=== END API RESPONSE ===");

              const msg = data.choices && data.choices[0] && data.choices[0].message;
              let rawReply = (msg && msg.content) || "";

              // content가 비어 있으면 reasoning_content에서 JSON 블록 추출 시도
              if (!rawReply.trim() && msg && msg.reasoning_content) {
                const rc = msg.reasoning_content;
                const m = rc.match(/\{[\s\S]*\}/);
                if (m) rawReply = m[0];
              }

              // Log for debugging
              console.log("=== RAW AI RESPONSE (length: " + rawReply.length + ") ===");
              console.log(rawReply.substring(0, 3000));
              console.log("=== END RESPONSE ===");

              // Parse JSON from response (handle markdown code blocks, trailing text)
              try {
                let jsonStr = rawReply.trim();
                // Try code block first
                const codeBlockMatch = jsonStr.match(/```(?:json)?\s*([\s\S]*?)```/);
                if (codeBlockMatch) {
                  jsonStr = codeBlockMatch[1].trim();
                } else {
                  // Try to extract JSON object from surrounding text
                  const jsonMatch = jsonStr.match(/\{[\s\S]*\}/);
                  if (jsonMatch) {
                    jsonStr = jsonMatch[0];
                  }
                }
                parsed = JSON.parse(jsonStr);
              } catch (e) {
                lastError = "JSON parse: " + e.message + " | raw: " + rawReply.substring(0, 200);
                console.error("Attempt " + attempt + " failed: " + lastError);
                await new Promise(r => setTimeout(r, 5000 * attempt));
                continue;
              }

              if (!parsed.edits || parsed.edits.length === 0) {
                lastError = "no edits in response: " + JSON.stringify(parsed).substring(0, 300);
                console.error("Attempt " + attempt + " failed: " + lastError);
                parsed = null;
                await new Promise(r => setTimeout(r, 5000 * attempt));
                continue;
              }

              break; // 성공
            }

            if (!parsed) {
              core.setFailed("Nous API failed after 3 attempts: " + lastError);
              return;
            }

            // base64 인코딩으로 출력해 셸 특수문자(따옴표/백틱/$) 문제 원천 차단
            core.setOutput("plan_b64", Buffer.from(JSON.stringify(parsed)).toString("base64"));
        env:
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}

      - name: Apply edits (/oc)
        if: steps.api-oc.outputs.plan_b64
        shell: bash
        run: |
          # base64 디코딩해 파일로 저장 (셸 특수문자 문제 원천 차단)
          echo "$PLAN_B64" | base64 -d > plan.json
          echo "Plan: $(cat plan.json)"

          node -e "
            const fs = require('fs');
            const plan = JSON.parse(fs.readFileSync('plan.json', 'utf8'));

            for (const edit of plan.edits) {
              const content = fs.readFileSync(edit.file, 'utf8');
              if (!content.includes(edit.old)) {
                console.error('ERROR: old text not found in ' + edit.file);
                console.error('Looking for: ' + edit.old.substring(0, 100));
                process.exit(1);
              }
              const newContent = content.replace(edit.old, edit.new);
              fs.writeFileSync(edit.file, newContent);
              console.log('Applied edit to ' + edit.file);
            }
            console.log('All edits applied successfully');
          "
        env:
          PLAN_B64: ${{ steps.api-oc.outputs.plan_b64 }}

      - name: Create branch and commit (/oc)
        if: steps.api-oc.outputs.plan_b64
        id: branch-oc
        shell: bash
        run: |
          echo "$PLAN_B64" | base64 -d > plan.json
          BRANCH=$(node -e "console.log(JSON.parse(require('fs').readFileSync('plan.json','utf8')).branch || 'oc-fix-$(date +%s)')")
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix: apply /oc edits via OpenCode

          Automated fix based on issue context.
          Branch: $BRANCH"
          git push origin "$BRANCH"
        env:
          PLAN_B64: ${{ steps.api-oc.outputs.plan_b64 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR (/oc)
        if: steps.branch-oc.outputs.branch
        uses: actions/github-script@v7
        with:
          script: |
            const plan = JSON.parse(Buffer.from(process.env.PLAN_B64, "base64").toString("utf8"));
            const branch = process.env.BRANCH;
            const isIssue = !!context.payload.issue;
            const number = isIssue
              ? context.payload.issue.number
              : context.payload.pull_request?.number;

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "fix: " + (plan.explanation || " edits via /oc"),
              head: branch,
              base: "main",
              body: [
                "## Summary",
                plan.explanation || "Automated fix",
                "",
                "Changes:",
                ...plan.edits.map(e => "- `" + e.file + "`: " + e.old.substring(0, 50) + " → " + e.new.substring(0, 50)),
                "",
                "Triggered by: #" + number,
                "",
                "---",
                "*This PR was auto-generated by OpenCode bot*",
              ].join("\n"),
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: "🤖 OpenCode created PR #" + pr.data.number + " on branch `" + branch + "`\n\n" + (plan.explanation || ""),
            });
        env:
          PLAN_B64: ${{ steps.api-oc.outputs.plan_b64 }}
          BRANCH: ${{ steps.branch-oc.outputs.branch }}

