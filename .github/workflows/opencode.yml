name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # /oc → OpenCode
      - name: Run OpenCode (/oc)
        if: |
          contains(github.event.comment.body, '/oc') ||
          startsWith(github.event.comment.body, '/oc') ||
          contains(github.event.comment.body, '/opencode') ||
          startsWith(github.event.comment.body, '/opencode')
        uses: anomalyco/opencode/github@latest
        env:
          ZHIPU_API_KEY: ${{ secrets.NOUS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.NOUS_API_KEY }}
          OPENAI_BASE_URL: https://inference-api.nousresearch.com/v1
        with:
          model: meituan/longcat-2.0:free

      # /cc → Nous API 직접 호출
      - name: Run Claude Code (/cc)
        if: |
          contains(github.event.comment.body, '/cc') ||
          startsWith(github.event.comment.body, '/cc')
        env:
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
        run: |
          curl -s https://inference-api.nousresearch.com/v1/chat/completions \
            -H "Authorization: Bearer *** \
            -H "Content-Type: application/json" \
            -d '{
              "model": "meituan/longcat-2.0:free",
              "messages": [{"role": "user", "content": "${{ github.event.comment.body }}"}]
            }'
