    name: opencode

    on:
      issues:
        types: [opened]
      issue_comment:
        types: [created]
      pull_request_review_comment:
        types: [created]

    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    jobs:
      opencode:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Run OpenCode (/oc)
            if: |
              contains(github.event.comment.body, '/oc') ||
              startsWith(github.event.comment.body, '/oc') ||
              contains(github.event.comment.body, '/opencode') ||
              startsWith(github.event.comment.body, '/opencode')
            env:
              OPENAI_API_KEY: ${{ secrets.NOUS_API_KEY }}
              OPENAI_BASE_URL: https://inference-api.nousresearch.com/v1
            run: |
              curl -s https://inference-api.nousresearch.com/v1/chat/completions \
                -H "Authorization: Bearer ${{ secrets.NOUS_API_KEY }}" \
                -H "Content-Type: application/json" \
                -d '{
                  "model": "meituan/longcat-2.0:free",
                  "messages": [{"role": "user", "content": "${{ github.event.comment.body }}"}],
                  "max_tokens": 4096
                }'

          - name: Run Claude Code (/cc)
            if: |
              contains(github.event.comment.body, '/cc') ||
              startsWith(github.event.comment.body, '/cc')
            env:
              OPENAI_API_KEY: ${{ secrets.NOUS_API_KEY }}
              OPENAI_BASE_URL: https://inference-api.nousresearch.com/v1
            run: |
              curl -s https://inference-api.nousresearch.com/v1/chat/completions \
                -H "Authorization: Bearer ${{ secrets.NOUS_API_KEY }}" \
                -H "Content-Type: application/json" \
                -d '{
                  "model": "meituan/longcat-2.0:free",
                  "messages": [{"role": "user", "content": "${{ github.event.comment.body }}"}],
                  "max_tokens": 4096
                }'
