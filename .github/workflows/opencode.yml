name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  oc:
    name: "OpenCode (/oc)"
    if: |
      github.event_name == 'issue_comment' &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: React to comment (/oc)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: "eyes",
            });

      - name: Gather repo context (/oc)
        id: ctx-oc
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: ".",
            });
            const fileList = files.data.map(f => (f.type === "dir" ? "[dir] " : "") + f.name).join("\n");
            core.setOutput("fileList", fileList);
            core.setOutput("repo", context.repo.owner + "/" + context.repo.repo);

      - name: Call Nous API (/oc)
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = context.payload.comment.body;
            const isIssue = !!context.payload.issue;
            const number = isIssue
              ? context.payload.issue.number
              : context.payload.pull_request?.number;

            const fileList = process.env.FILE_LIST;
            const repo = process.env.REPO;

            const systemPrompt = [
              "You are a GitHub comment bot for the repository \"" + repo + "\".",
              "",
              "WHAT THIS REPO IS:",
              "Static HTML site for 2027 Korean university essay admission calendar (2027학년도 논술전형 달력).",
              "Main file: index.html — all calendar data is INLINE in JS objects (deadlines, exams, results arrays).",
              "",
              "REPO FILES:",
              fileList,
              "",
              "YOUR ROLE:",
              "- Read the issue/PR comment and respond helpfully as a text comment only.",
              "- You CANNOT push code, create PRs, edit files, or access external URLs/PDFs.",
              "- NEVER claim you verified PDFs, checked websites, or made code changes.",
              "- NEVER say \"PR 올리겠습니다\", \"수정하겠습니다\", \"확인했습니다\" unless literally true.",
              "",
              "WHEN USER ASKS TO FIX DATA (e.g. wrong dates):",
              "1. Acknowledge the report",
              "2. State the CURRENT value from repo data you can see",
              "3. State the CORRECTED value the user provided (or mark as unverified if unsure)",
              "4. Give the exact line/snippet to change",
              "",
              "KEEP IT SHORT. 2-5 bullet points max. No filler.",
            ].join("\n");

            const userPrompt = "A user wrote this " + (isIssue ? "issue comment" : "PR review comment") + ":\n\n\"" + commentBody + "\"\n\nRespond concisely as a helpful bot. Remember: you cannot edit code or access PDFs.";

            const res = await fetch(
              "https://inference-api.nousresearch.com/v1/chat/completions",
              {
                method: "POST",
                headers: {
                  Authorization: "Bearer " + process.env.NOUS_API_KEY,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  model: "meituan/longcat-2.0:free",
                  messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: userPrompt },
                  ],
                  max_tokens: 2048,
                }),
              }
            );

            if (!res.ok) {
              const err = await res.text();
              core.setFailed("Nous API error " + res.status + ": " + err);
              return;
            }

            const data = await res.json();
            const reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "(no response)";

            const marker = "<!-- oc-bot -->";
            const body = marker + "\n🤖 **OpenCode** responded:\n\n" + reply;

            if (isIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
            } else {
              await github.rest.pulls.createReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
                body,
                commit_id: context.payload.comment.commit_id,
                path: context.payload.comment.path,
                line: context.payload.comment.line ?? context.payload.comment.original_line,
              });
            }
        env:
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
          FILE_LIST: ${{ steps.ctx-oc.outputs.fileList }}
          REPO: ${{ steps.ctx-oc.outputs.repo }}

  cc:
    name: "Claude Code (/cc)"
    if: |
      github.event_name == 'issue_comment' &&
      (
        contains(github.event.comment.body, ' /cc') ||
        startsWith(github.event.comment.body, '/cc')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: React to comment (/cc)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
